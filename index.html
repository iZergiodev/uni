<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#02060f" />
    <meta name="description" content="T-Universe: los productos de Tandem orbitando alrededor de su estrella." />
    <title>T-Universe</title>
    <link rel="icon" type="image/png" href="/productos/Tandem_logo.png" />
  </head>
  <body>
    <canvas id="universo" aria-hidden="true"></canvas>
    <div id="etiquetas" class="etiquetas" aria-hidden="true"></div>

    <div id="interfaz" class="interfaz">
      <header class="cabecera">
        <button id="marca" class="marca" type="button" aria-label="Ver todo el universo">
          <img src="/productos/Tandem_logo.png" alt="" width="28" height="28" />
          <span>T-Universe</span>
        </button>
        <button id="pausa" class="boton" type="button" aria-pressed="false">
          <svg class="icono-pausa" viewBox="0 0 16 16" aria-hidden="true">
            <rect x="3" y="2.5" width="3.4" height="11" />
            <rect x="9.6" y="2.5" width="3.4" height="11" />
          </svg>
          <svg class="icono-seguir" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M4 2.5 13.5 8 4 13.5Z" />
          </svg>
          <span>Pausar órbitas</span>
        </button>
      </header>

      <p id="pista" class="pista">Arrastra para girar el universo y pulsa un planeta para verlo de cerca.</p>

      <nav id="dock" class="dock" aria-label="Productos"></nav>

      <aside id="ficha" class="ficha" aria-labelledby="ficha-nombre" hidden>
        <button id="ficha-volver" class="boton ficha-volver" type="button">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" /></svg>
          <span>Volver al universo</span>
        </button>
        <div class="ficha-cabecera">
          <div id="ficha-emblema" class="ficha-emblema"></div>
          <div>
            <h2 id="ficha-nombre" class="ficha-nombre"></h2>
            <p id="ficha-lema" class="ficha-lema"></p>
          </div>
        </div>
        <a id="ficha-enlace" class="ficha-enlace" target="_blank" rel="noopener" hidden>Visitar la web</a>
        <nav class="ficha-nav" aria-label="Otros productos">
          <button id="ficha-anterior" class="ficha-paso" type="button">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" /></svg>
            <span></span>
          </button>
          <button id="ficha-siguiente" class="ficha-paso" type="button">
            <span></span>
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5" /></svg>
          </button>
        </nav>
      </aside>
    </div>

    <p id="anuncio" class="solo-lectores" aria-live="polite"></p>
    <div id="aviso" class="aviso" role="alert" hidden></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
